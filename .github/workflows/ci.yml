name: CI

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS-Dateien vorhanden
        run: ls js/helpers.js js/catalog.js js/floors.js js/render.js js/main.js

      - name: JS-Syntax prüfen (node --check)
        run: for f in js/*.js; do node --check "$f"; done

      - name: Kern-Dateien vorhanden
        run: test -f index.html && test -f styles.css && test -f README.md
